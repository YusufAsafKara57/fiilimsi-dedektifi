<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiilimsi Dedektifi - Çevrim İçi Kitap Modu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .cinzel { font-family: 'Cinzel', serif; }
        .case-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
        .parchment { background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%); color: #2c221e; }
        .word-token { transition: all 0.15s ease; cursor: pointer; }
        .word-token:hover { transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-amber-500 selection:text-black">

    <div id="app" class="w-full max-w-4xl mx-auto">
        <!-- Nickname / Giriş Ekranı -->
        <div id="screen-login" class="bg-slate-900 border border-slate-700 rounded-2xl p-8 case-shadow text-center max-w-md mx-auto">
            <div class="inline-block p-4 bg-amber-500/10 border border-amber-500/30 rounded-full mb-6">
                <svg class="w-12 h-12 text-amber-400 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <h1 class="cinzel text-3xl font-black text-amber-400 mb-2">FİİLİMSİ DEDEKTİFİ</h1>
            <p class="text-slate-400 text-sm mb-6">20 Kilitli Kitap Bölümü ve Gerçek Zamanlı Bulut Sıralaması</p>
            
            <input type="text" id="nickname-input" placeholder="Dedektif Mahlasınız (Örn: Komiser Can)" maxlength="20" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-amber-400 mb-4 font-semibold">
            
            <button onclick="saveNickname()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl transition shadow-lg cinzel">
                DOSYALARI AÇ VE BAŞLA
            </button>
        </div>

        <!-- Ana Menü / Kitap İndeksi -->
        <div id="screen-menu" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-widest block">Aktif Dedektif</span>
                    <span id="display-nickname" class="text-amber-400 font-bold text-lg"></span>
                </div>
                <div class="flex gap-2">
                    <button onclick="openLeaderboard()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-semibold transition flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        Gerçek Çevrim İçi Sıralama
                    </button>
                    <button onclick="resetUser()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm">Değiştir</button>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 case-shadow">
                <div class="text-center mb-6">
                    <h2 class="cinzel text-2xl font-bold text-amber-400">DEDEKTİFLİK KİTABI (KİLİTLİ 20 BÖLÜM)</h2>
                    <p class="text-slate-400 text-sm">Sonraki bölümü açmak için sırasıyla önceki bölümleri tamamlamalısınız.</p>
                </div>
                
                <div id="chapters-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 max-h-[60vh] overflow-y-auto pr-2">
                    <!-- Dinamik Bölümler -->
                </div>
            </div>
        </div>

        <!-- Oyun / Soruşturma Ekranı -->
        <div id="screen-game" class="hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 case-shadow">
                <!-- Üst Bilgi Barı -->
                <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b border-slate-800">
                    <div>
                        <button onclick="backToMenu()" class="text-slate-400 hover:text-white
