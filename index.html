<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiilimsi Dedektifi - Kusursuz Sürüm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .cinzel { font-family: 'Cinzel', serif; }
        .case-shadow { box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
        .parchment { background: linear-gradient(135deg, #fdfbf7 0%, #f4ebd0 100%); color: #2c221e; }
        .word-token { transition: all 0.15s ease; cursor: pointer; }
        .word-token:hover { transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-amber-500 selection:text-black">

    <div id="app" class="w-full max-w-4xl mx-auto">
        <!-- Ana Menü / Kitap İndeksi -->
        <div id="screen-menu" class="screen-section">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 bg-slate-900 p-4 rounded-xl border border-slate-800">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <div>
                        <span class="text-xs text-slate-400 uppercase tracking-widest block">Operasyon Merkezi</span>
                        <span class="text-amber-400 font-bold text-lg">Baş Dedektif</span>
                    </div>
                </div>
                
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="openLeaderboard()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        Sıralama
                    </button>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 case-shadow">
                <div class="text-center mb-6">
                    <h2 class="cinzel text-2xl font-bold text-amber-400">DEDEKTİFLİK KİTABI (20 GİZLİ DOSYA)</h2>
                    <p class="text-slate-400 text-sm">Her dosya artan zorluk derecesine ve kilitli ipuçlarına sahiptir.</p>
                </div>
                
                <div id="chapters-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 max-h-[60vh] overflow-y-auto pr-2">
                    <!-- Dinamik Bölümler -->
                </div>
            </div>
        </div>

        <!-- Bölüm Giriş / İpucu Ekranı -->
        <div id="screen-briefing" class="screen-section hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 case-shadow max-w-xl mx-auto">
                <span id="briefing-ch-num" class="text-xs text-amber-400 font-bold uppercase tracking-widest block mb-2">DOSYA #01 İNCELENİYOR</span>
                <h3 id="briefing-title" class="cinzel text-2xl font-bold text-white mb-4">Soruşturma Başlangıcı</h3>
                
                <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-xl mb-6">
                    <span class="text-xs font-bold text-amber-400 block mb-2 uppercase tracking-wide">🔍 İstihbarat ve Sürükleyici İpucu</span>
                    <p id="briefing-hint-text" class="text-slate-300 text-sm leading-relaxed italic"></p>
                </div>

                <div class="flex justify-between items-center">
                    <button onclick="backToMenu()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-semibold transition">Kitaba Dön</button>
                    <button onclick="proceedToDifficulty()" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-xl text-sm transition cinzel">Zorluk Seçimine Geç →</button>
                </div>
