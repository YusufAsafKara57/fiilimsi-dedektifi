<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiilimsi Dedektifi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 6px;
            font-size: 26px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-item span {
            color: #38bdf8;
        }
        .game-box {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .question-title {
            font-size: 18px;
            margin-bottom: 16px;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        button.option-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button.option-btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
        .feedback {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .feedback.correct {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
            display: block;
        }
        .feedback.wrong {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
            display: block;
        }
        .next-btn {
            display: none;
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .next-btn:hover {
            background: #059669;
        }
        .restart-screen {
            text-align: center;
            display: none;
        }
        .restart-screen h2 {
            color: #38bdf8;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔍 Fiilimsi Dedektifi</h1>
        <div class="subtitle">Bölümleri Tamamla, Fiilimsileri Bul!</div>

        <div class="stats">
            <div class="stat-item">Bölüm: <span id="current-level">1</span> / 5</div>
            <div class="stat-item">Puan: <span id="score">0</span></div>
        </div>

        <div class="game-box" id="game-container">
            <div class="question-title" id="question-text">Soru yükleniyor...</div>
            <div class="options-grid" id="options-container"></div>
            <div class="feedback" id="feedback-box"></div>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">Sonraki Soruye Geç ➔</button>
        </div>

        <div class="restart-screen" id="restart-screen">
            <h2>🎉 Tebrikler Dedektif!</h2>
            <p id="final-score-text" style="font-size: 18px; margin: 20px 0;"></p>
            <button class="option-btn" style="text-align: center;" onclick="restartGame()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                level: 1,
                text: "1. Bölüm: \"Bahçedeki sararmış yaprakları tek tek temizledi.\" cümlesinde altı çizili (sararmış) kelime hangi fiilimsidir?",
                options: [
                    { text: "A) Sıfat-Fiil (-mış eki sıfat görevinde kullanılmıştır)", correct: true },
                    { text: "B) İsim-Fiil", correct: false },
                    { text: "C) Zarf-Fiil", correct: false },
                    { text: "D) Fiil Değildir", correct: false }
                ],
                explanation: "Doğru! '-mış' eki fiile gelerek sıfat görevinde kullanıldığı için sıfat-fiildir."
            },
            {
                level: 2,
                text: "2. Bölüm: \"Eve gelir gelmez ellerini sabunla yıkadı.\" cümlesinde zarf-fiil (bağ-fiil) eki almış ifade hangisidir?",
                options: [
                    { text: "A) Eve", correct: false },
                    { text: "B) gelir gelmez (-r... -mez eki zarf-fiildir)", correct: true },
                    { text: "C) ellerini", correct: false },
                    { text: "D) yıkadı", correct: false }
                ],
                explanation: "Harika! '-r... -mez' ekleri cümleye zaman anlamı katan zarf-fiil ekleridir."
            },
            {
                level: 3,
                text: "3. Bölüm: \"Sabah spor yapmak sağlığımız için çok faydalıdır.\" cümlesindeki isim-fiil hangi ekle kurulmuştur?",
                options: [
                    { text: "A) -ma / -me", correct: false },
                    { text: "B) -mak / -mek (-mak ekiyle isim-fiil olmuştur)", correct: true },
                    { text: "C) -ış / -iş", correct: false },
                    { text: "D) -an / -en", correct: false }
                ],
                explanation: "Tebrikler! 'yap-mak' sözcüğündeki '-mak' eki isim-fiil (mastar) ekidir."
            },
            {
                level: 4,
                text: "4. Bölüm: \"Görünmez kaza insanı her yerden bulur.\" cümlesinde kalıcı isimleşmiş veya sıfat-fiil olmuş kelime hangisidir?",
                options: [
                    { text: "A) Görünmez (Sıfat-fiil eki olan -mez kalıbıyla kurulmuştur)", correct: true },
                    { text: "B) kaza", correct: false },
                    { text: "C) insanı", correct: false },
                    { text: "D) bulur", correct: false }
                ],
                explanation: "Doğru! '-mez' sıfat-fiil eki fiilimsi görevindedir."
            },
            {
                level: 5,
                text: "5. Bölüm: \"Çocuk koşa koşa yanımıza geldi.\" cümlesinde zarf-fiil hangi yolla ve ekle kurulmuştur?",
                options: [
                    { text: "A) -ma / -me ekiyle", correct: false },
                    { text: "B) -dik / -dik ekiyle", correct: false },
                    { text: "C) ikileme şeklinde kullanılan -a ... -a ekleriyle", correct: true },
                    { text: "D) -r ... -mez ekiyle", correct: false }
                ],
                explanation: "Harika bitiriş! 'koşa koşa' ikilemesi zarf-fiil görevindedir."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = questions[currentQuestionIndex];
            document.getElementById('current-level').textContent = q.level;
            document.getElementById('score').textContent = score;
            document.getElementById('question-text').textContent = q.text;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(index);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('feedback-box').className = 'feedback';
            document.getElementById('feedback-box').textContent = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function selectOption(selectedIndex) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const feedbackBox = document.getElementById('feedback-box');
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, idx) => {
                if (q.options[idx].correct) {
                    btn.style.background = '#10b981';
                } else if (idx === selectedIndex) {
                    btn.style.background = '#ef4444';
                }
                btn.style.cursor = 'default';
            });

            if (q.options[selectedIndex].correct) {
                feedbackBox.className = 'feedback correct';
                feedbackBox.textContent = "✔ " + q.explanation;
                score += 20;
            } else {
                feedbackBox.className = 'feedback wrong';
                feedbackBox.textContent = "✖ Yanlış! Doğru cevap yeşil renkle işaretlendi.";
            }

            document.getElementById('score').textContent = score;
            
            if (currentQuestionIndex < questions.length - 1) {
                document.getElementById('next-btn').style.display = 'block';
            } else {
                setTimeout(() => {
                    showRestartScreen();
                }, 1500);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showRestartScreen() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('restart-screen').style.display = 'block';
            document.getElementById('final-score-text').textContent = `Toplam Puanın: ${score} / 100`;
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('restart-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
